# =============================================================================
#  Como a automacao se comporta. Copie para config/settings.yaml e ajuste:
#      cp config/settings.example.yaml config/settings.yaml
# =============================================================================

# ---------------------------------------------------------------------------
#  MODO DE ENVIO  (leia antes de mudar)
#    dry_run : so descobre e mostra as vagas. Nao abre navegador. (padrao)
#    review  : abre o navegador, PREENCHE tudo, tira screenshot e PARA.
#              Voce revisa e confirma no terminal antes do submit. RECOMENDADO.
#    auto    : preenche e envia sem confirmar. Exige tambem
#              allow_auto_submit: true na empresa em companies.yaml.
# ---------------------------------------------------------------------------
submit_mode: review

# Limites de seguranca (evitam spam, bloqueio de conta e erro em massa)
limits:
  max_applications_per_run: 5
  max_applications_per_day: 15
  max_per_company_per_day: 5
  min_seconds_between_applications: 45
  max_seconds_between_applications: 120

# Navegador (usado nos modos review/auto)
browser:
  headless: false            # false = voce ve o que esta acontecendo (recomendado)
  slow_mo_ms: 120            # atraso entre acoes; ajuda o site a acompanhar
  timeout_ms: 45000
  # Diretorio de perfil persistente: mantem seus logins (Workday, Gupy, MS)
  # entre execucoes, entao voce loga uma vez por portal.
  user_data_dir: "browser-profile"
  screenshot_dir: "data/screenshots"
  locale: "pt-BR"
  viewport: { width: 1440, height: 900 }
  # Opcional: usar um Chrome/Chromium ja instalado em vez do que o Playwright baixa.
  # Tambem pode ser definido pela variavel PLAYWRIGHT_CHROMIUM_EXECUTABLE.
  # executable_path: "/usr/bin/google-chrome"

# ---------------------------------------------------------------------------
#  CARGO ALVO
#  O bloco 'filters' abaixo e a base. Cada cargo aqui SUBSTITUI as chaves que
#  declarar (nao soma) — um perfil de estagio precisa poder apagar "estagi" do
#  title_exclude herdado.
#
#  Qual cargo vale: o primeiro cuja janela de datas cobre HOJE.
#  Assim a busca vira sozinha na virada do ano, sem voce mexer em nada.
#
#  active_role: "auto"  -> decide pela data (recomendado)
#  active_role: "junior" -> trava neste cargo, ignorando as datas
#  Para espiar o futuro sem mudar nada:  candidate discover --role junior
#  Vai estagiar mais tempo? mude o valid_until do cargo "estagio" e pronto.
#  Para ver qual esta valendo e quando troca:  candidate roles
# ---------------------------------------------------------------------------
active_role: auto

roles:
  - name: estagio
    description: "Estagio em tecnologia"
    valid_until: "2027-12-31"        # estagio agora e durante todo o 2027
    resume: estagio                  # usa documents.resumes.estagio, se existir
    filters:
      title_include:
        - estagi
        - estági
        - intern
        - internship
        - aprendiz
      title_exclude:                 # cuidado: substitui a lista base inteira
        - senior
        - sênior
        - pleno
        - especialista
        - manager
        - gerente
        - coordenador
        - lead
        - vendas
        - sales
        - comercial
        - juridico
        - jurídico
        - rh
      keywords_boost:
        python: 3
        desenvolvimento: 2
        software: 2
        dados: 2
        backend: 2
        remoto: 2
      posted_within_days: 30         # estagio enche rapido; vaga velha ja era
    # Perguntas que so aparecem em processo de estagio.
    # Tem prioridade sobre as screening_answers do profile.yaml.
    screening_answers:
      - match: ["previs(a|ã)o de (formatura|conclus(a|ã)o)", "graduation date", "quando (voce|você) se forma"]
        answer: "Dezembro de 2028"
      - match: ["semestre|per(i|í)odo do curso|qual per(i|í)odo"]
        answer: "5º semestre"
      - match: ["curso|gradua(c|ç)(a|ã)o em que|qual curso"]
        answer: "Ciencia da Computacao"
      - match: ["institui(c|ç)(a|ã)o de ensino|universidade|faculdade"]
        answer: "Universidade Exemplo"
      - match: ["turno|per(i|í)odo dispon(i|í)vel|disponibilidade de hor(a|á)rio"]
        answer: "Manha e tarde (6 horas diarias)"
      - match: ["matriculad|est(a|á) cursando|comprova(c|ç)(a|ã)o de matr(i|í)cula"]
        answer: "Sim, matriculado e cursando"
      - match: ["pretens(a|ã)o salarial|bolsa[- ]?aux(i|í)lio|expectativa de bolsa"]
        answer: "Compativel com a bolsa oferecida pelo programa"

  - name: junior
    description: "Desenvolvedor junior / entry level"
    valid_from: "2028-01-01"         # entra em vigor sozinho em 01/01/2028
    valid_until: "2029-12-31"
    resume: default
    filters:
      title_include:
        - junior
        - júnior
        - " jr"
        - engenheir
        - engineer
        - desenvolvedor
        - developer
        - software
        - backend
        - entry level
      title_exclude:
        - estagi
        - estági
        - intern
        - trainee
        - senior
        - sênior
        - staff
        - principal
        - manager
        - gerente
        - director
        - diretor
      keywords_boost:
        python: 3
        kubernetes: 2
        aws: 2
        fastapi: 2
        remoto: 2
      posted_within_days: 45

  - name: pleno
    description: "Desenvolvedor pleno"
    valid_from: "2030-01-01"         # daqui a alguns anos; ajuste quando chegar la
    resume: default
    filters:
      title_include:
        - pleno
        - engenheir
        - engineer
        - desenvolvedor
        - developer
        - software
        - backend
      title_exclude:
        - estagi
        - intern
        - trainee
        - junior
        - júnior
        - manager
        - gerente
        - diretor
      posted_within_days: 60

# Filtros base, usados quando nenhum cargo declara a chave.
# O cargo ativo acima SUBSTITUI as chaves que ele declarar.
filters:
  # Se a vaga NAO tiver nenhum destes termos no titulo, e descartada.
  title_include:
    - engineer
    - engenheir
    - developer
    - desenvolvedor
    - software
    - backend
    - back-end
    - full stack
    - fullstack
    - platform
    - data
    - sre
    - devops
  # Se tiver qualquer um destes, e descartada.
  title_exclude:
    - intern
    - estagi
    - trainee
    - manager
    - gerente
    - director
    - diretor
    - vp
    - principal
    - staff
    - sales
    - vendas
    - recruit
    - marketing
    - designer
    - qa manual
  # Localidades aceitas (substring, case-insensitive). Vazio = qualquer lugar.
  locations_include:
    - brasil
    - brazil
    - sao paulo
    - são paulo
    - remote
    - remoto
    - latam
  locations_exclude: []
  # Palavras que valem pontos extras no ranking (nao filtram)
  keywords_boost:
    python: 3
    kubernetes: 2
    aws: 2
    fastapi: 2
    postgres: 1
    remote: 2
  min_score: 1               # score minimo para entrar na fila de candidatura
  posted_within_days: 45     # 0 = sem limite de data

# Onde guardar o historico de candidaturas
storage:
  database: "data/applications.sqlite3"
  reports_dir: "data/reports"

# Carta de apresentacao
cover_letter:
  enabled: true
  attach_when_optional: false   # true = anexa mesmo quando o campo e opcional

logging:
  level: "INFO"                 # DEBUG mostra cada campo preenchido
  file: "data/automatic-candidate.log"
